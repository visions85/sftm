# SFTM memory description for JTFRAME (`jtframe mem sftm`).
# Lives in cfg/ (jtframe reads $JTROOT/cores/<core>/cfg/mem.yaml).
# Generates sftm_game_sdram.v (in cores/sftm/mister/) and mem_ports.inc.
#
# ROM regions — download order must match SDRAM bank order (see cfg/mame2mra.toml):
#   prog   1.00 MB  4x256KB PROMs, 32-bit interleaved   (68EC020 program)
#   snd    0.25 MB  sound CPU (6809)
#   srom   2.50 MB  srom0 (2MB) + srom3 (512KB)  (ES5506 samples)
#   grom  32.00 MB  rm0-0..3 + rm1-0..3 (blitter graphics)
#   grm3   0.50 MB  sfm_grm3_0..3 (extra graphics plane)
#
# Total ~36 MB. NO BUS MAY BE WIDER THAN ITS BANK. JTFRAME_SDRAM_LARGE gives
# four 16 MB banks, and a bus declared wider than that silently loses its top
# address bit -- jtframe_romrq_bcache.v:114 forms the address as
# offset + {{SDRAMW-AW{1'b0}}, addr_req}, and when AW > SDRAMW that
# replication width goes NEGATIVE, with no Quartus warning. grom used to be
# one 32 MB bus in one 16 MB bank, so grom_addr[24] was discarded: the rm1
# mask ROMs aliased onto rm0 and, downloading second, overwrote them.
# Confirmed on hardware; see cfg/macros.def.
#
# So grom is split at bit 24 into two 16 MB buses, one per bank, and srom
# moves in beside the CPUs. Everything then fits four 16 MB banks, which also
# means the core runs on 64 MB modules, not just 128 MB ones.
#
# NOTE: jtframe addr_width counts BYTE-address bits regardless of data_width;
# the generated port is [addr_width-1 : log2(data_width/8)]. The previous
# version of this file treated addr_width as word-address bits, silently
# halving/quartering every bus (main could only reach 256 KB of the 1 MB
# program ROM). Corrected 2026-08-12; regenerate mem_ports.inc/_sdram.v.

clocks:
  clk:                # 48 MHz reference
    - freq: 25000000  # ~MC68EC020 @ 25 MHz (functional TG68K, tuned to vsync)
      outputs:
        - e020
    - freq: 16000000  # Ensoniq ES5506 master
      outputs:
        - es
    - freq: 4000000   # 2x the MC6809 E clock: sftm_snd alternates the
      outputs:        # mc6809i cen_E/cen_Q quadrature enables on this
        - snd

sdram:
  # The 68EC020 is BIG-endian. A 32-bit cache lane fills from 16-bit SDRAM and
  # has to choose which half each incoming word lands in; the default is
  # little-endian, so the CPU gets every longword with its two halves swapped.
  #
  # jtframe_cache_ctrl.sv:368 (fill_write_data), :384 (fill_write_mask) and
  # :401 (wb_ext_word):
  #     if( DW == 32 && ENDIAN ) pos = half_idx[0] ? 0 : 1;
  #     else                     pos = half_idx % HALF_PER_WORD;
  # ENDIAN=0 puts SDRAM word 0 in dout[15:0], so longword 0 reads back {w1,w0}.
  # Build 66 measured exactly that: the high half came back 0x8000 = w1 where
  # w0 was due.
  #
  # game_sdram.v:403 emits .ENDIANn ( big_endian && data_width==32 ? 1 : 0 ),
  # so this reaches EXACTLY the two 32-bit lanes, main and vram, and leaves the
  # 16-bit lanes (grom, srom, grm3) untouched -- they keep the packing the
  # working banks build had. jtframe rejects the key outside cache-lanes
  # (mem.go:629), which is why it could not have been set before this
  # conversion.
  #
  # vram needs no change: fill, byte-enable and writeback all derive from the
  # same `pos`, so the permutation cancels for a lane only sftm_vram touches.
  #
  # NB: ENDIAN in jtframe_dual_ram32 is a different thing -- there it feeds
  # only SIMFILE_BYTE (which byte of a sim hex file seeds each byte-RAM) and
  # the data path is straight through. Checking that file alone says
  # "simulation-only" and is misleading; the cache controller above is the
  # module that actually places the words.
  big_endian: true

  # cache-lanes, not banks: they are mutually exclusive so the whole map
  # converts. The reason is the vram lane. A plain rw slot is capped at 16 bits
  # (jtframe_ram_rq takes read data as din[0+:DW] off the 16-bit data_read bus
  # and special-cases only DW==8) and data_width: 32 on a plain bus is SILENTLY
  # DOWNGRADED. A cache lane gives real 32-bit rw with four byte enables, and
  # more importantly a block cache: the blitter writes pixels sequentially
  # along a row, so writes to one 256-byte block coalesce instead of paying an
  # SDRAM transaction per 16-bit pixel.
  #
  # Build 56 measured ~65k writes/frame against 92,160 for one background, so
  # the blitter never finishes a frame -- which is both the low frame rate and
  # the background streaks (transient partial-redraw content).
  #
  # NOTE: `at.offset` is in 16-bit WORDS, not bytes (mem.go computes
  # offset_bytes := offset_words << 1). Byte offsets here are half these values.
  #
  # Also: jtframe emits this offset verbatim as C hex, which is not Verilog.
  # docker/entrypoint.sh patches mem.go to convert it. rw lanes must be among
  # the first four.
  #
  # No flush interface: EVERY VRAM access -- prefetch, blitter reads, blitter
  # writes -- now goes through this one cache, so coherency is automatic and
  # nothing else ever reads VRAM out of SDRAM behind it.
  #
  # vramrd is GONE: it existed only to read two pixels per access through a
  # read-only 32-bit alias. The vram lane is 32-bit itself and now serves the
  # prefetch, the blitter reads and the blitter writes through ONE cache, which
  # also removes the read/write coherency question.
  cache-lanes:
    - name: vram          # byte 0x80000 in bank 3, past grm3's 512 kB
      # 64-bit: 4 pens per transaction. Hardware (b106) measured the lane
      # saturated for a whole frame with ~80k hit transactions at ~5 clk each;
      # doubling the word halves that. ENDIAN does not apply (the generator
      # forces little-endian for non-32-bit lanes) and does not matter: vram
      # is pure RAM, never downloaded, so sftm_vram defines the slot layout
      # on both the write and the read side.
      data_width: 64
      rw: true
      blocks: { count: 64, size: 256 }
      at: { bank: 3, offset: "0x40000", length: 2MB }
    - name: grm3
      data_width: 16
      rw: false
      blocks: { count: 8, size: 256 }
      at: { bank: 3, offset: "0x0", length: 512kB }
    # rw so the program ROM can be written over JTAG.
    #
    # The SLD hub is only reachable when the FPGA is configured from the .sof
    # over JTAG, and that skips MiSTer's ROM download; SDRAM does not survive
    # the ~3 s configure (measured: the first longword came back 0x00808000
    # against 0x00008000, one bit out and stable, i.e. retention decay). So the
    # ROM has to be pushed in over JTAG afterwards.
    #
    # Writing through the SAME lane the CPU reads makes it coherent for free --
    # a separate write lane over the same region would leave main's cache
    # holding stale lines. rw lanes must be among the first four; main is third.
    - name: main
      data_width: 32
      rw: true
      blocks: { count: 16, size: 256 }
      at: { bank: 0, offset: "0x0", length: 1MB }
    - name: snd           # byte 0x100000
      data_width: 8
      rw: false
      blocks: { count: 8, size: 256 }
      at: { bank: 0, offset: "0x80000", length: 512kB }
    - name: srom          # byte 0x150000
      data_width: 16
      rw: false
      blocks: { count: 16, size: 256 }
      at: { bank: 0, offset: "0xA8000", length: 4MB }
    # 64-bit (build 108): 8 source pixels per fetch. b107 metering moved the
    # bottleneck here -- the blitter's one-word fetch cache paid a ~5 clk
    # lane transaction for every OTHER source pixel (GROM stall 35% of busy).
    # ENDIAN=0 keeps the download byte order: byte i of an 8-byte group reads
    # at word[8*i +: 8], verified against the real download in tb_cachelane
    # Phase K before deploying (the b102 lesson).
    - name: grom0
      data_width: 64
      rw: false
      blocks: { count: 32, size: 256 }
      at: { bank: 1, offset: "0x0", length: 16MB }
    - name: grom1
      data_width: 64
      rw: false
      blocks: { count: 32, size: 256 }
      at: { bank: 2, offset: "0x0", length: 16MB }
